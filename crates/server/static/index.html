<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlacialCast</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --ice: #9be7ff;
      --ink: #07131c;
      --panel: #102431;
      --line: #244656;
      --muted: #91a9b5;
      --danger: #ff8d8d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: #edfaff;
      background:
        radial-gradient(circle at 90% -10%, #1b5366 0, transparent 35rem),
        linear-gradient(155deg, #07131c, #0a1b25 60%, #102733);
    }
    header, main { width: min(68rem, calc(100% - 2rem)); margin-inline: auto; }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      padding: 3rem 0 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 4.5rem); letter-spacing: -.06em; }
    .eyebrow {
      margin: 0 0 .35rem;
      color: var(--ice);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .connection { color: var(--muted); font: 500 .8rem ui-monospace, monospace; }
    main { padding: 2rem 0 4rem; }
    .summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .summary h2 { margin: 0; font-size: 1rem; }
    button, a.action {
      border: 1px solid var(--line);
      border-radius: .5rem;
      padding: .58rem .8rem;
      color: inherit;
      background: #163342;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, a.action:hover { border-color: var(--ice); }
    button.danger { color: var(--danger); background: transparent; }
    #streams { display: grid; gap: .8rem; }
    .stream {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      padding: 1.15rem;
      border: 1px solid var(--line);
      border-radius: .8rem;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      box-shadow: 0 1rem 3rem #0003;
    }
    .stream h3 {
      margin: 0 0 .3rem;
      overflow: hidden;
      font-size: 1.08rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta, .source {
      color: var(--muted);
      font: .78rem/1.55 ui-monospace, monospace;
      overflow-wrap: anywhere;
    }
    .source { margin-top: .4rem; }
    .actions { display: flex; align-items: center; gap: .45rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      margin-right: .5rem;
      color: var(--ice);
    }
    .badge::before {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: currentColor;
      content: "";
      box-shadow: 0 0 .8rem currentColor;
    }
    .badge.offline { color: var(--muted); }
    .empty {
      padding: 4rem 1rem;
      border: 1px dashed var(--line);
      border-radius: .8rem;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 42rem) {
      header { align-items: start; flex-direction: column; }
      .stream { grid-template-columns: 1fr; }
      .actions { justify-content: start; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Low-bandwidth screen relay</p>
      <h1>GlacialCast</h1>
    </div>
    <div id="connection" class="connection">connecting</div>
  </header>
  <main>
    <div class="summary">
      <h2 id="count">Streams</h2>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div id="streams" aria-live="polite"></div>
  </main>
  <script>
    const streamsElement = document.querySelector('#streams');
    const countElement = document.querySelector('#count');
    const connectionElement = document.querySelector('#connection');

    function formatBytes(bytes) {
      const units = ['B', 'KiB', 'MiB', 'GiB'];
      let value = Number(bytes || 0);
      let unit = 0;
      while (value >= 1024 && unit < units.length - 1) {
        value /= 1024;
        unit += 1;
      }
      return `${value.toFixed(unit ? 1 : 0)} ${units[unit]}`;
    }

    function appendText(parent, className, value) {
      const element = document.createElement('div');
      element.className = className;
      element.textContent = value;
      parent.append(element);
      return element;
    }

    function renderStream(stream) {
      const article = document.createElement('article');
      article.className = 'stream';

      const details = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = stream.display_name || stream.client_id || stream.stream_id;
      details.append(title);

      const status = stream.active ? 'live' : 'offline';
      const metadata = appendText(
        details,
        'meta',
        `${status} · ${stream.media_kind} · ${formatBytes(stream.retained_bytes)} retained`
      );
      const badge = document.createElement('span');
      badge.className = `badge${stream.active ? '' : ' offline'}`;
      badge.textContent = status;
      metadata.textContent = '';
      metadata.append(badge, document.createTextNode(
        `${stream.media_kind} · ${formatBytes(stream.retained_bytes)} retained`
      ));
      appendText(
        details,
        'source',
        `${stream.source?.description || 'Unknown source'} · ${stream.stream_id}`
      );

      const actions = document.createElement('div');
      actions.className = 'actions';
      if (stream.media_kind === 'Dash') {
        const open = document.createElement('a');
        open.className = 'action';
        open.href = `/dash/${encodeURIComponent(stream.stream_id)}`;
        open.textContent = 'Open viewer';
        actions.append(open);
      }
      const remove = document.createElement('button');
      remove.className = 'danger';
      remove.type = 'button';
      remove.textContent = 'Delete';
      remove.addEventListener('click', async () => {
        if (!confirm(`Delete ${title.textContent} and all retained data?`)) return;
        const response = await fetch(`/api/streams/${encodeURIComponent(stream.stream_id)}`, {
          method: 'DELETE'
        });
        if (!response.ok && response.status !== 404) {
          alert(await response.text());
          return;
        }
        await refresh();
      });
      actions.append(remove);
      article.append(details, actions);
      return article;
    }

    async function refresh() {
      const response = await fetch('/api/streams', { cache: 'no-store' });
      if (!response.ok) throw new Error(await response.text());
      const streams = await response.json();
      streams.sort((left, right) =>
        Number(right.active) - Number(left.active) ||
        String(left.display_name).localeCompare(String(right.display_name))
      );
      countElement.textContent = `${streams.length} stream${streams.length === 1 ? '' : 's'}`;
      streamsElement.replaceChildren();
      if (!streams.length) {
        appendText(streamsElement, 'empty', 'No streams yet. Start a GlacialCast client to publish one.');
        return;
      }
      streams.forEach((stream) => streamsElement.append(renderStream(stream)));
    }

    function connectEvents() {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${scheme}://${location.host}/api/ws`);
      socket.addEventListener('open', () => {
        connectionElement.textContent = 'live updates connected';
      });
      socket.addEventListener('message', () => refresh().catch(showError));
      socket.addEventListener('close', () => {
        connectionElement.textContent = 'reconnecting';
        setTimeout(connectEvents, 1000);
      });
      socket.addEventListener('error', () => socket.close());
    }

    function showError(error) {
      connectionElement.textContent = error.message || String(error);
    }

    document.querySelector('#refresh').addEventListener('click', () => refresh().catch(showError));
    refresh().catch(showError);
    connectEvents();
  </script>
</body>
</html>
