<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlacialCast</title>
  <link rel="stylesheet" href="/assets/index.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Low-bandwidth screen relay</p>
      <h1>GlacialCast</h1>
    </div>
    <div class="account">
      <span id="identity" class="connection"></span>
      <span id="connection" class="connection">connecting</span>
      <button id="logout" type="button">Sign out</button>
    </div>
  </header>
  <main>
    <section id="operations" class="operations" hidden>
      <div class="summary">
        <div>
          <p class="eyebrow">Relay diagnostics</p>
          <h2>Last 60 seconds</h2>
        </div>
      </div>
      <div id="metric-cards" class="metric-cards" aria-live="polite"></div>
    </section>
    <div class="summary">
      <h2 id="count">Streams</h2>
      <button id="refresh" type="button">Refresh</button>
    </div>
    <div id="streams" aria-live="polite"></div>
  </main>
  <script src="/assets/index.js"></script>
</body>
</html>
