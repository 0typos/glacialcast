[package]
name = "gcview"
edition.workspace = true
description = "Native GlacialCast multi-stream viewer."
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[lib]
name = "glacialcast_viewer"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
eframe.workspace = true
glacialcast-protocol = { path = "../protocol", version = "1.0.0" }
openh264 = { workspace = true, features = ["source"] }
postcard.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[[bin]]
name = "gcview"
path = "src/main.rs"

[lints]
workspace = true
