name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner for all jobs. `beefy` targets the on-demand self-hosted
          runner — start it with `ci-runner 0typos/glacialcast -j N`.
        type: choice
        options: [ubuntu-24.04, beefy]
        default: ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install native build dependencies
        # Hosted runners only — the beefy host provides these natively (no apt).
        if: inputs.runner != 'beefy'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgbm-dev libpipewire-0.3-dev libexpat1-dev shellcheck
      - name: Install cargo-deny
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: scripts/verify-quality.sh standard

  native-e2e:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install native build dependencies
        # Hosted runners only — the beefy host provides these natively (no apt).
        if: inputs.runner != 'beefy'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgbm-dev libpipewire-0.3-dev libexpat1-dev nasm python3
          sudo scripts/ci-install-openh264.sh
      - run: scripts/verify-native-e2e.sh

  packaging:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Install native build dependencies
        # Hosted runners only — the beefy host provides these natively (no apt).
        if: inputs.runner != 'beefy'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgbm-dev libpipewire-0.3-dev libexpat1-dev nodejs rpm
      - name: Install package builder
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"
      - run: scripts/verify-packaging.sh
      - run: scripts/build-packages.sh
      - run: packaging/verify-packages.sh
