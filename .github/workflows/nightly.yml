name: Nightly native gates

on:
  schedule:
    - cron: "19 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-native-gates
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgbm-dev libpipewire-0.3-dev libexpat1-dev nasm python3 shellcheck
          sudo scripts/ci-install-openh264.sh
      - name: Install cargo-deny
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: scripts/verify-quality.sh full

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly-2026-07-03 --profile minimal
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libgbm-dev libpipewire-0.3-dev libexpat1-dev
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-03 install cargo-fuzz --version 0.13.2 --locked
      - run: GLACIALCAST_FUZZ_SECONDS=60 scripts/verify-fuzz.sh
