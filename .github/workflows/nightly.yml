name: Nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-main
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: Thirty-minute reliability soak
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libopenh264-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev \
            nasm
      - name: Install OpenH264 2.6
        # ubuntu-24.04 packages 2.4 under a different soname, which builds and
        # then fails at runtime. See the script for why this is built.
        run: sudo scripts/ci-install-openh264.sh
      - name: Run reliability soak
        env:
          GLACIALCAST_SOAK_SECONDS: "1800"
          GLACIALCAST_SOAK_SAMPLE_SECONDS: "10"
        run: scripts/verify-soak.sh

  internet:
    name: Internet profile through HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libopenh264-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev \
            nasm
      - name: Install OpenH264 2.6
        # ubuntu-24.04 packages 2.4 under a different soname, which builds and
        # then fails at runtime. See the script for why this is built.
        run: sudo scripts/ci-install-openh264.sh
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/glacialcast-playwright playwright@1.59.1
          /tmp/glacialcast-playwright/node_modules/.bin/playwright install --with-deps firefox chromium
      - name: Verify the Internet profile end to end
        # The only gate that runs the fail-closed profile as deployed: Caddy
        # terminating real TLS in front, a public origin, mandatory tokens, and
        # a forwarded client address. It is here rather than in CI because it
        # needs a container for Caddy and drives two engines.
        #
        # It is also the only place a browser reaches the viewer over HTTPS, so
        # it is what proves encrypted playback still works in the secure context
        # the LAN profile deliberately cannot offer.
        env:
          GLACIALCAST_PLAYWRIGHT_MODULE: /tmp/glacialcast-playwright/node_modules/playwright
          # Cold Chromium on a shared two-core runner measured 713ms for its
          # first live append where Firefox on the same runner measured 21ms and
          # both measure ~15ms locally. The clock covers a fresh browser reaching
          # its first append and Playwright noticing the metrics text change, so
          # at that end of it the number is about the runner, not the relay. The
          # 250ms default still applies everywhere else, including locally.
          GLACIALCAST_VERIFY_MAX_APPEND_MS: "2000"
        run: scripts/verify-internet-browser.sh

  browsers:
    name: Firefox and Chromium playback (${{ matrix.test-pattern }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test-pattern: [motion, static]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libopenh264-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev \
            nasm
      - name: Install OpenH264 2.6
        # ubuntu-24.04 packages 2.4 under a different soname, which builds and
        # then fails at runtime. See the script for why this is built.
        run: sudo scripts/ci-install-openh264.sh
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/glacialcast-playwright playwright@1.59.1
          /tmp/glacialcast-playwright/node_modules/.bin/playwright install --with-deps firefox chromium
      - name: Run live and offline browser matrix
        env:
          GLACIALCAST_PLAYWRIGHT_MODULE: /tmp/glacialcast-playwright/node_modules/playwright
          GLACIALCAST_VERIFY_BROWSERS: firefox,chromium
          GLACIALCAST_VERIFY_OFFLINE_BROWSERS: firefox,chromium
          GLACIALCAST_VERIFY_TEST_PATTERN: ${{ matrix.test-pattern }}
        run: scripts/verify-dash-e2e.sh

  unencrypted:
    name: Unencrypted publishing in both engines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libopenh264-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev \
            nasm
      - name: Install OpenH264 2.6
        # ubuntu-24.04 packages 2.4 under a different soname, which builds and
        # then fails at runtime. See the script for why this is built.
        run: sudo scripts/ci-install-openh264.sh
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/glacialcast-playwright playwright@1.59.1
          /tmp/glacialcast-playwright/node_modules/.bin/playwright install --with-deps firefox chromium
      - name: Verify the unencrypted publishing mode
        # CI runs this against Firefox alone. Here it gets both engines, which
        # is what covers the Chromium half of a mode whose entire reason for
        # existing is a third engine no runner has: WebKit.
        env:
          GLACIALCAST_PLAYWRIGHT_MODULE: /tmp/glacialcast-playwright/node_modules/playwright
          GLACIALCAST_VERIFY_BROWSERS: firefox,chromium
        run: scripts/verify-unencrypted.sh

  fuzz:
    name: Parser fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install nightly-2026-07-03 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run parser fuzz targets
        env:
          GLACIALCAST_FUZZ_SECONDS: "60"
        run: scripts/verify-fuzz.sh
      - name: Preserve fuzz failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-fuzz-failures
          path: fuzz/artifacts/
          if-no-files-found: ignore
