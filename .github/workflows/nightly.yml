name: Nightly native gates

on:
  schedule:
    - cron: "19 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev libpipewire-0.3-dev libexpat1-dev python3
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - run: scripts/verify-quality.sh full
