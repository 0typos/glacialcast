name: Release archive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  acceptance:
    name: Full release acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libopenh264-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev
      - name: Install pinned Rust tools
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/glacialcast-playwright playwright@1.59.1
          /tmp/glacialcast-playwright/node_modules/.bin/playwright install --with-deps firefox chromium
      - name: Run full deterministic gate
        env:
          GLACIALCAST_REQUIRE_CLEAN: "1"
        run: scripts/verify-quality.sh full
      - name: Run Firefox and Chromium live/offline gate
        env:
          GLACIALCAST_PLAYWRIGHT_MODULE: /tmp/glacialcast-playwright/node_modules/playwright
          GLACIALCAST_VERIFY_BROWSERS: firefox,chromium
          GLACIALCAST_VERIFY_OFFLINE_BROWSERS: firefox,chromium
          GLACIALCAST_VERIFY_TEST_PATTERN: motion
          GLACIALCAST_VERIFY_IDLE_HEARTBEAT_SECONDS: "4"
        run: scripts/verify-dash-e2e.sh

  package:
    name: Linux release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: acceptance
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            libclang-dev \
            libgbm-dev \
            libopenh264-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libva-dev
      - name: Build and verify archive
        env:
          GLACIALCAST_REQUIRE_CLEAN: "1"
        run: scripts/verify-packaging.sh
      - name: Upload archive, checksum, and optional signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glacialcast-linux-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.minisig
          if-no-files-found: error
