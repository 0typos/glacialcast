[workspace]
members = [
    "crates/client",
    "crates/dash",
    "crates/offline",
    "crates/protocol",
    "crates/server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
aes = "0.8"
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1.6"
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
cros-codecs = { version = "0.0.6", features = ["vaapi"] }
ctr = "0.9"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
openh264 = { version = "0.9.7", default-features = false, features = ["libloading"] }
libc = "0.2"
pipewire = "0.9.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.9"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
zvariant = "5.11"

[patch.crates-io]
# cros-libva 0.0.12 does not initialize libva 1.23's new VP9 fields. Keep
# cros-codecs' expected API and carry the one-line forward-compatibility fix.
cros-libva = { path = "vendor/cros-libva" }
