[workspace]
members = [
    "crates/publisher",
    "crates/protocol",
    "crates/relay",
    "crates/viewer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/0typos/glacialcast"
version = "1.0.0"
# These crates ship as a release archive, not as registry packages. Keep an
# accidental `cargo publish` from claiming the names.
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = "3.0"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
gbm = { version = "0.15", default-features = false }
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
openh264 = { version = "0.9.7", default-features = false, features = ["libloading"] }
libc = "0.2"
libloading = "0.8"
pipewire = "0.9.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = "0.9"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zbus = { version = "5.15", default-features = false, features = ["tokio"] }
zvariant = "5.11"
zeroize = { version = "1.8", features = ["derive"] }

# Numeric conversions that can silently lose data, denied in the crates that
# parse untrusted bytes and build authenticated ones. Most existing casts are
# already guarded a line or two above; this is what keeps the next one from
# not being. Opted into per crate, because the client is mostly FFI where
# casting to a C type is the point.
[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
