[package]
name = "glacialcast-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
glacialcast-stream = { path = "../crates/stream" }
glacialcast-protocol = { path = "../crates/protocol" }
libfuzzer-sys = "0.4"

[[bin]]
name = "portable_object"
path = "fuzz_targets/portable_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cursor_envelope"
path = "fuzz_targets/cursor_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "noise_segment"
path = "fuzz_targets/noise_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "epoch_descriptor"
path = "fuzz_targets/epoch_descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transfer_index"
path = "fuzz_targets/transfer_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_wire"
path = "fuzz_targets/native_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pair_request"
path = "fuzz_targets/pair_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h264_epoch"
path = "fuzz_targets/h264_epoch.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
